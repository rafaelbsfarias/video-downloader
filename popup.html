<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: sans-serif; width: 320px; padding: 12px; margin: 0; color: #1f2937; }
    h4 { margin: 0 0 10px 0; font-size: 15px; }
    #thumbContainer {
      display: none;
      margin-bottom: 10px;
      border-radius: 6px;
      overflow: hidden;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
    }
    #thumbImg {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
    }
    #videoTitle {
      padding: 6px 8px;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.3;
      max-height: 3.6em;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    label { display: block; margin-top: 10px; font-size: 12px; font-weight: 600; }
    select, button { display: block; margin-top: 4px; width: 100%; padding: 6px; box-sizing: border-box; border-radius: 4px; border: 1px solid #d1d5db; }
    button { margin-top: 12px; cursor: pointer; font-weight: 600; background: #2563eb; color: #fff; border: none; padding: 8px; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    .checkbox-group { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; }
    .checkbox-group input { width: auto; margin: 0; cursor: pointer; }
    .checkbox-group label { margin: 0; font-weight: normal; cursor: pointer; }
    #status { margin-top: 10px; font-size: 12px; line-height: 1.4; white-space: pre-line; }
    #playlistInfo { margin-top: 6px; font-size: 12px; font-weight: 600; color: #2563eb; display: none; }
    progress { width: 100%; margin-top: 8px; height: 12px; }
    details { margin-top: 10px; font-size: 11px; }
    summary { cursor: pointer; font-weight: 600; color: #4b5563; user-select: none; }
    #logConsole {
      margin-top: 6px;
      background: #111827;
      color: #e5e7eb;
      font-family: monospace;
      font-size: 10px;
      padding: 8px;
      border-radius: 4px;
      height: 130px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .log-err { color: #f87171; }
    .log-warn { color: #fbbf24; }
    .log-info { color: #93c5fd; }
  </style>
</head>
<body>
  <h4>Baixar do YouTube</h4>

  <div id="thumbContainer">
    <img id="thumbImg" src="" alt="Thumbnail do vídeo">
    <div id="videoTitle"></div>
  </div>

  <label for="format">Formato:</label>
  <select id="format">
    <option value="mp4">MP4 (vídeo)</option>
    <option value="mp3">MP3 (áudio)</option>
    <option value="thumb">Apenas Thumbnail (.jpg)</option>
  </select>

  <div id="qualityGroup">
    <label for="quality">Qualidade:</label>
    <select id="quality">
      <option value="best">Melhor disponível</option>
      <option value="worst">Pior disponível</option>
      <option value="720">720p</option>
      <option value="480">480p</option>
      <option value="360">360p</option>
    </select>
  </div>

  <div class="checkbox-group" id="saveThumbGroup">
    <input type="checkbox" id="saveThumbToggle" checked>
    <label for="saveThumbToggle">Salvar arquivo da thumb (.jpg) e embutir capa</label>
  </div>

  <div class="checkbox-group" id="saveLocalGroup">
    <input type="checkbox" id="saveAsToggle" checked>
    <label for="saveAsToggle">Escolher onde salvar na máquina local (Salvar Como)</label>
  </div>

  <div class="checkbox-group" id="playlistOptionContainer" style="display: none;">
    <input type="checkbox" id="playlistToggle">
    <label for="playlistToggle">Baixar playlist completa</label>
  </div>

  <button id="downloadBtn">Baixar</button>
  <div id="playlistInfo"></div>
  <div id="status"></div>
  <div id="localFilesContainer" style="display: none; margin-top: 8px; font-size: 11px;"></div>
  <progress id="progressBar" value="0" max="100"></progress>

  <details id="logDetails">
    <summary>🔍 Logs em tempo real (Observabilidade)</summary>
    <div id="logConsole">Aguardando início...</div>
  </details>

  <script src="popup.js"></script>
</body>
</html>
